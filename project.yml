name: Karv
options:
  bundleIdPrefix: com.cml.karv
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  defaultConfig: Debug

packages:
  KarvCore:
    path: Packages/KarvCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7R6QL53THM
    CODE_SIGN_STYLE: Automatic

targets:
  Karv:
    type: application
    platform: iOS
    sources:
      - path: Apps/KarvIOS/Sources
      - path: Apps/KarvIOS/Resources
    dependencies:
      - package: KarvCore
      - target: KarvWidget
        embed: true
    info:
      path: Apps/KarvIOS/Info.plist
      properties:
        CFBundleDisplayName: Karv
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "Karv discovers KarvMac on your local Wi-Fi network to sync your AI usage stats."
        NSBonjourServices:
          - _karv._tcp
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.cml.karv.refresh
        CFBundleURLTypes:
          - CFBundleURLName: com.cml.karv.ios
            CFBundleURLSchemes:
              - karv
    entitlements:
      path: Apps/KarvIOS/Karv.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.cml.karv.shared
        com.apple.security.application-groups:
          - group.com.cml.karv.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.cml.karv.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cml.karv.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  KarvWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/KarvWidget/Sources
    dependencies:
      - package: KarvCore
    info:
      path: Apps/KarvWidget/Info.plist
      properties:
        CFBundleDisplayName: Karv Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Apps/KarvWidget/KarvWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cml.karv.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.cml.karv.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cml.karv.ios.widget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

  KarvMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/KarvMac/Sources
    dependencies:
      - package: KarvCore
    entitlements:
      path: Apps/KarvMac/KarvMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.cml.karv.shared
        keychain-access-groups:
          - $(TeamIdentifierPrefix)com.cml.karv.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cml.karv.mac
        INFOPLIST_KEY_CFBundleDisplayName: KarvMac
        INFOPLIST_KEY_LSUIElement: YES
        GENERATE_INFOPLIST_FILE: YES
        COMBINE_HIDPI_IMAGES: YES
